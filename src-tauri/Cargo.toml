[package]
name = "cabina"
version = "0.1.0"
description = "Cabina: software DJ con motor de audio nativo"
edition = "2021"

[lib]
name = "cabina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
cc = "=1.2.41"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
cpal = "=0.16.0"
symphonia = { version = "=0.5.5", features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "aiff", "pcm", "vorbis", "ogg", "opt-simd"] }
rustfft = "=6.4.1"
crossbeam-queue = "=0.3.12"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
